<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="KITE Trading Dashboard" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>KITE | Trading Dashboard</title>

    <!-- PayPal SDK for Live Production Donations -->
    <!-- Replace YOUR_PAYPAL_CLIENT_ID with your Client ID from developer.paypal.com -->
    <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=USD"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- React Root App -->
    <div id="root"></div>

    <!-- PayPal Donation Container -->
    <div id="paypal-donation-container" style="text-align: center; margin: 20px 0;">
      <p style="font-weight: bold; font-family: sans-serif; color: #333;">Support KITE Platform</p>
      <div id="paypal-donate-button"></div>
    </div>

    <!-- Render Script using payee email delijah5415@gmail.com -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (window.paypal) {
          paypal.Buttons({
            style: {
              shape: 'rect',
              color: 'gold',
              layout: 'vertical',
              label: 'donate'
            },
            createOrder: function(data, actions) {
              return actions.order.create({
                purchase_units: [{
                  amount: {
                    value: '10.00' // Default donation amount (USD)
                  },
                  payee: {
                    email_address: 'delijah5415@gmail.com' // Production recipient email
                  },
                  description: 'Donation to Trading Platform'
                }]
              });
            },
            onApprove: function(data, actions) {
              return actions.order.capture().then(function(details) {
                alert('Thank you for your donation, ' + details.payer.name.given_name + '!');
              });
            },
            onError: function(err) {
              console.error('PayPal Transaction Error:', err);
            }
          }).render('#paypal-donate-button');
        }
      });
    </script>
  </body>
</html>
