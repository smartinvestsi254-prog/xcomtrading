<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="KITE Trading Dashboard" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>KITE | Trading Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="font-awesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="font-awesome/css/brands.min.css" />
    <link rel="stylesheet" href="font-awesome/css/solid.min.css" />

    <!-- PayPal SDK (Hosted Buttons Component) -->
    <script 
      src="https://www.paypal.com/sdk/js?client-id=BAAQePvJch8VJquVFOuHvsq9vi5aGRmqVvSeqjnhcnLFjrOIZ4G2dOwmBPAdNs-MdzhLGHSdqoJ7dY_gwo&components=hosted-buttons&disable-funding=venmo&currency=USD">
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- React App Root Container -->
    <div id="root"></div>

    <!-- PayPal Donation Section -->
    <div id="paypal-donation-wrapper" style="text-align: center; margin: 30px auto; max-width: 400px; padding: 15px;">
      <div id="paypal-container-PLDUTTW4EA9B6"></div>
    </div>

    <!-- Render Hosted PayPal Button Script -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (window.paypal && window.paypal.HostedButtons) {
          paypal.HostedButtons({
            hostedButtonId: "PLDUTTW4EA9B6",
          }).render("#paypal-container-PLDUTTW4EA9B6");
        }
      });
    </script>

    <!-- Bootstrap Bundle JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
